version: 2
updates:
  # GitHub Actions: keeps the SHA pins and their version comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # NuGet packages for the app, the core library and the tests.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Patch and minor bumps ride together for review convenience; majors stay separate.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
