name: Dependency review

# Warns on a pull request that adds or bumps a NuGet package (or an action) with a known
# High or Critical advisory, before it's merged. Runs only when a manifest or workflow changes.
# Advisories found after merge are reported by Dependabot alerts (enabled on the repo).
on:
  pull_request:
    paths:
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/Directory.*.props'
      - '**/packages.lock.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
