name: Dependency review

# Warns on a pull request that adds or bumps a NuGet package (or an action) with a known
# High or Critical advisory, before it's merged. Runs only when a manifest or workflow changes.
# Advisories found after merge are reported by Dependabot alerts (enabled on the repo).
on:
  pull_request:
    paths:
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/Directory.*.props'
      - '**/packages.lock.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
